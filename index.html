<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">

<body>
<title>Akademik Takvim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Düzen: solda "ne zaman ne yapılacak" ajandası (eylem tarihine göre), sağda ay takvimi + tarihsiz işler; telefonda tek sütun. */
:root {
  --bg: #EDF0F3; --surface: #FFFFFF; --sunk: #F5F7F9; --ink: #15202B; --muted: #5A6674; --line: #D6DCE3;
  --accent: #1D5BA6; --accent-soft: #E1EBF7;
  --late: #B93A26; --late-soft: #FBE9E5; --soon: #A86A12; --soon-soft: #FBF0DC; --ok: #2C7553;
  --t-hakemlik: #1D5BA6; --t-editorluk: #7A4BB0; --t-proje: #1E7F7A; --t-yayin: #3A47A8; --t-idari: #6B7380; --t-tez: #A0522D; --t-ders: #8A6D12; --t-iletisim: #B23A6E;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E141B; --surface: #161F29; --sunk: #121A23; --ink: #E4EAF0; --muted: #94A2B1; --line: #283442;
  --accent: #6FA4E6; --accent-soft: #1A2B40;
  --late: #F0806A; --late-soft: #3A1E1A; --soon: #E2B160; --soon-soft: #362A15; --ok: #63C497;
  --t-hakemlik: #6FA4E6; --t-editorluk: #B593E0; --t-proje: #5CC3BC; --t-yayin: #8E9AF0; --t-idari: #A3ACB8; --t-tez: #E0956B; --t-ders: #D9BC5E; --t-iletisim: #EB86B3;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0E141B; --surface: #161F29; --sunk: #121A23; --ink: #E4EAF0; --muted: #94A2B1; --line: #283442;
  --accent: #6FA4E6; --accent-soft: #1A2B40;
  --late: #F0806A; --late-soft: #3A1E1A; --soon: #E2B160; --soon-soft: #362A15; --ok: #63C497;
  --t-hakemlik: #6FA4E6; --t-editorluk: #B593E0; --t-proje: #5CC3BC; --t-yayin: #8E9AF0; --t-idari: #A3ACB8; --t-tez: #E0956B; --t-ders: #D9BC5E; --t-iletisim: #EB86B3;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 48px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* Üst bölüm */
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
.today-day { font-family: var(--f-display); font-size: clamp(34px, 6vw, 52px); font-weight: 700; line-height: 1; letter-spacing: -.02em; }
.today-sub { color: var(--muted); margin-top: 6px; }
.stats { display: flex; flex-wrap: wrap; gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; min-width: 112px; }
.stat b { display: block; font-family: var(--f-display); font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat.late b { color: var(--late); }
.stat.soon b { color: var(--soon); }

/* Filtre */
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 20px 0 6px; }
.chip { font: 500 13px var(--f-body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); flex: none; }

.grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 32px; margin-top: 14px; align-items: start; }
@media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr); } }

/* Ajanda */
.group { margin-top: 26px; }
.group-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.group-head h2 { font-size: 20px; font-weight: 700; }
.group-head .count { color: var(--muted); font-size: 13px; }
.group.late .group-head h2 { color: var(--late); }
.rows { display: grid; gap: 10px; }
.row { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 14px; }
.when { padding-top: 14px; text-align: right; }
.when .d { font-family: var(--f-display); font-size: 24px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.when .m { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px 13px; position: relative; overflow: hidden; min-width: 0; }
.card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--sev, transparent); }
.card.sev-late { --sev: var(--late); }
.card.sev-soon { --sev: var(--soon); }
.card.teyit { border-style: dashed; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 12.5px; color: var(--muted); }
.meta .tur { display: inline-flex; align-items: center; gap: 6px; color: var(--c); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: 11.5px; }
.card h3 { font-family: var(--f-body); font-size: 16.5px; font-weight: 600; margin: 6px 0 4px; line-height: 1.35; }
.card p { margin: 0; color: var(--ink); opacity: .86; max-width: 68ch; }
.foot { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
.pill { font-size: 12.5px; border-radius: 6px; padding: 2px 8px; background: var(--sunk); border: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill.late { background: var(--late-soft); color: var(--late); border-color: transparent; font-weight: 600; }
.pill.soon { background: var(--soon-soft); color: var(--soon); border-color: transparent; font-weight: 600; }
.pill.rem { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.path { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.progress { display: inline-flex; gap: 3px; align-items: center; }
.progress i { width: 14px; height: 6px; border-radius: 2px; background: var(--line); }
.progress i.on { background: var(--t-proje); }
.note { margin-top: 6px; font-size: 13px; color: var(--muted); }

/* Yan panel */
aside { display: grid; gap: 22px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
@media (max-width: 900px) { aside { position: static; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-head h3 { font-size: 18px; }
.navbtn { border: 1px solid var(--line); background: var(--sunk); color: var(--ink); border-radius: 8px; width: 32px; height: 32px; cursor: pointer; font-size: 16px; }
.navbtn:disabled { opacity: .35; cursor: default; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; }
.cal .wd { font-size: 11px; color: var(--muted); padding-bottom: 4px; letter-spacing: .04em; }
.day { aspect-ratio: 1; max-width: 100%; border: 1px solid transparent; border-radius: 8px; background: none; color: var(--ink); font: 500 13px var(--f-body); font-variant-numeric: tabular-nums; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0; }
.day.other { visibility: hidden; }
.day.past { color: var(--muted); }
.day.today { border-color: var(--ink); font-weight: 700; }
.day.sel { background: var(--accent-soft); }
.day .marks { display: flex; gap: 2px; height: 6px; }
.day .marks span { width: 6px; height: 6px; border-radius: 2px; background: var(--c); }
.day .marks span.r { background: none; border: 1.5px solid var(--accent); border-radius: 50%; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.lg-d { width: 8px; height: 8px; border-radius: 2px; background: var(--accent); }
.lg-r { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--accent); }
.dayinfo { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; font-size: 13.5px; display: grid; gap: 6px; }
.dayinfo .empty { color: var(--muted); }
.dayinfo .it { display: flex; gap: 8px; align-items: baseline; }
.dayinfo .it .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); flex: none; width: 74px; }
.undated { display: grid; gap: 0; }
.undated .u { padding: 10px 0; border-top: 1px solid var(--line); }
.undated .u:first-child { border-top: none; padding-top: 2px; }
.undated .u b { font-weight: 600; display: block; font-size: 14px; }
.undated .u small { color: var(--muted); font-size: 12.5px; display: block; }
details { font-size: 13.5px; }
summary { cursor: pointer; color: var(--muted); }
details ul { margin: 8px 0 0; padding-left: 18px; color: var(--muted); }
footer { margin-top: 36px; color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); padding-top: 14px; }
@media (max-width: 520px) {
  .wrap { padding-inline: 16px; }
  .row { grid-template-columns: 52px minmax(0, 1fr); gap: 10px; }
  .when .d { font-size: 20px; }
  .stat { min-width: 0; flex: 1 1 90px; }
}
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s; } .card:hover { border-color: var(--muted); } }
.lock { max-width: 380px; margin: 12vh auto 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 24px; display: grid; gap: 12px; }
.lock h1 { font-size: 26px; }
.lock input { font: 16px var(--f-body); padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--sunk); color: var(--ink); }
.lock button { font: 600 15px var(--f-body); padding: 10px 12px; border-radius: 8px; border: 0; background: var(--ink); color: var(--bg); cursor: pointer; }
.lock .err { color: var(--late); font-size: 13.5px; min-height: 1.2em; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer; text-decoration: underline; }
</style>

<form class="lock" id="lock" hidden>
  <div class="label">Akademik takvim</div>
  <h1>Kilitli</h1>
  <label for="pw">Şifre</label>
  <input id="pw" type="password" autocomplete="current-password" required>
  <button type="submit">Aç</button>
  <div class="err" id="lockErr"></div>
</form>

<div class="wrap" id="app">
  <header class="top">
    <div>
      <div class="label">Akademik takvim</div>
      <div class="today-day" id="todayDay">—</div>
      <div class="today-sub" id="todaySub"></div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="filters" id="filters" role="group" aria-label="İş türüne göre süz"></div>

  <div class="grid">
    <main id="agenda"></main>
    <aside>
      <section class="panel" aria-label="Ay takvimi">
        <div class="cal-head">
          <button class="navbtn" id="prevM" aria-label="Önceki ay">‹</button>
          <h3 id="monthName"></h3>
          <button class="navbtn" id="nextM" aria-label="Sonraki ay">›</button>
        </div>
        <div class="cal" id="cal"></div>
        <div class="legend"><span><i class="lg-d"></i>Son tarih</span><span><i class="lg-r"></i>Hatırlatma</span></div>
        <div class="dayinfo" id="dayinfo"></div>
      </section>
      <section class="panel">
        <div class="label" style="margin-bottom:8px">Tarihi olmayan bekleyenler</div>
        <div class="undated" id="undated"></div>
      </section>
      <section class="panel">
        <details>
          <summary>Son tamamlananlar</summary>
          <ul id="done"></ul>
        </details>
      </section>
    </aside>
  </div>

  <footer id="foot"></footer>
</div>

  function diff(a, b) { return Math.round((b - a) / 864e5); }
  var now = new Date(); var T = new Date(now.getFullYear(), now.getMonth(), now.getDate()); var TK = K(T);
  function kisa(s) { var d = P(s); return d.getDate() + ' ' + AYK[d.getMonth()]; }
  function kalanTxt(n) { return n > 1 ? n + ' gün kaldı' : n === 1 ? 'yarın' : n === 0 ? 'bugün' : (-n) + ' gün geçti'; }

  var store = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  var filtre = store.get('takvim-filtre') || 'hepsi';

  // Her iş için eylem tarihi ve grubu
  var items = V.aktif.map(function (it) {
    var o = Object.assign({}, it);
    o.kalan = it.son_tarih ? diff(T, P(it.son_tarih)) : null;
    var rems = (it.hatirlat || []).slice().sort();
    var gecmis = rems.filter(function (r) { return r <= TK; });
    var sonraki = rems.filter(function (r) { return r > TK; })[0];
    o.sonrakiHat = sonraki || null;
    if ((o.kalan !== null && o.kalan < 0) || it.teyit) { o.grup = 'gecik'; o.eylem = it.son_tarih; }
    else if (gecmis.length) { o.grup = 'bugun'; o.eylem = TK; o.hatBeri = gecmis[0] < TK ? gecmis[gecmis.length - 1] : null; }
    else {
      var e = sonraki || null;
      if (it.son_tarih && (!e || it.son_tarih < e)) e = it.son_tarih;
      o.eylem = e;
      if (!e) o.grup = 'tarihsiz';
      else { var n = diff(T, P(e)); o.grup = n === 1 ? 'yarin' : n <= 7 ? 'hafta' : 'sonra'; }
    }
    o.sev = o.kalan === null ? '' : o.kalan < 0 ? 'late' : o.kalan <= 3 ? 'soon' : '';
    return o;
  });

  // Üst bölüm
  document.getElementById('todayDay').textContent = T.getDate() + ' ' + AY[T.getMonth()];
  document.getElementById('todaySub').textContent = GUN[T.getDay()] + ', ' + T.getFullYear();
  function sayi(f) { return items.filter(f).length; }
  var nGecik = sayi(function (o) { return o.grup === 'gecik'; });
  var nYakin = sayi(function (o) { return o.kalan !== null && o.kalan >= 0 && o.kalan <= 14; });
  var nGun = sayi(function (o) { return o.grup === 'bugun' || o.grup === 'yarin'; });
  document.getElementById('stats').innerHTML =
    '<div class="stat late"><b>' + nGecik + '</b><span class="label">Geciken / teyit</span></div>' +
    '<div class="stat"><b>' + nGun + '</b><span class="label">Bugün + yarın</span></div>' +
    '<div class="stat soon"><b>' + nYakin + '</b><span class="label">14 gün içinde son</span></div>' +
    '<div class="stat"><b>' + items.length + '</b><span class="label">Aktif iş</span></div>';

  // Filtreler
  var turler = []; items.forEach(function (o) { if (turler.indexOf(o.tur) < 0) turler.push(o.tur); });
  function cizFiltre() {
    var h = '<button class="chip" id="f-hepsi" data-f="hepsi" aria-pressed="' + (filtre === 'hepsi') + '">Tümü</button>';
    turler.forEach(function (t, i) { h += '<button class="chip" id="f-' + i + '" data-f="' + esc(t) + '" aria-pressed="' + (filtre === t) + '"><span class="dot" style="--c:' + turC(t) + '"></span>' + esc(turAd(t)) + '</button>'; });
    var el = document.getElementById('filters'); el.innerHTML = h;
    el.querySelectorAll('.chip').forEach(function (b) { b.onclick = function () { filtre = b.getAttribute('data-f'); store.set('takvim-filtre', filtre); cizFiltre(); cizAjanda(); }; });
  }
  if (filtre !== 'hepsi' && turler.indexOf(filtre) < 0) filtre = 'hepsi';

  function kart(o) {
    var f = '';
    if (o.son_tarih) {
      var cls = o.sev === 'late' ? 'late' : o.sev === 'soon' ? 'soon' : '';
      f += '<span class="pill ' + cls + '">Son tarih ' + kisa(o.son_tarih) + (o.son_saat ? ' ' + o.son_saat : '') + ' · ' + kalanTxt(o.kalan) + '</span>';
    } else f += '<span class="pill">Son tarih yok</span>';
    if (o.teyit) f += '<span class="pill soon">Teyit bekliyor</span>';
    if (o.hatBeri) f += '<span class="pill rem">Hatırlatma ' + kisa(o.hatBeri) + ' tarihinden beri</span>';
    if (o.sonrakiHat && o.grup !== 'tarihsiz') f += '<span class="pill rem">Sonraki hatırlatma ' + kisa(o.sonrakiHat) + '</span>';
    if (o.ilerleme) {
      var p = '<span class="progress" aria-label="' + o.ilerleme[0] + ' / ' + o.ilerleme[1] + '">';
      for (var i = 0; i < o.ilerleme[1]; i++) p += '<i class="' + (i < o.ilerleme[0] ? 'on' : '') + '"></i>';
      f += p + '</span><span class="pill">' + o.ilerleme[0] + ' / ' + o.ilerleme[1] + ' öğrenci</span>';
    }
    return '<article class="card ' + (o.sev ? 'sev-' + o.sev : '') + (o.teyit ? ' teyit' : '') + '" style="--c:' + turC(o.tur) + '">' +
      '<div class="meta"><span class="tur"><span class="dot"></span>' + esc(turAd(o.tur)) + '</span><span>' + esc(o.kurum || '') + '</span>' + (o.kimlik ? '<span class="mono">' + esc(o.kimlik) + '</span>' : '') + '</div>' +
      '<h3>' + esc(o.baslik) + '</h3><p>' + esc(o.yapilacak || '') + '</p>' +
      (o.not ? '<div class="note">' + esc(o.not) + '</div>' : '') +
      '<div class="foot">' + f + '</div>' +
      (o.ilgili ? '<div class="path" style="margin-top:8px">' + esc(o.ilgili) + '</div>' : '') +
      '</article>';
  }

  var GRUPLAR = [['gecik','Geciken ve teyit bekleyen'],['bugun','Bugün'],['yarin','Yarın'],['hafta','Bu hafta'],['sonra','Daha sonra']];
  function cizAjanda() {
    var vis = items.filter(function (o) { return filtre === 'hepsi' || o.tur === filtre; });
    var h = '';
    GRUPLAR.forEach(function (g) {
      var list = vis.filter(function (o) { return o.grup === g[0]; }).sort(function (a, b) { return (a.eylem || '9').localeCompare(b.eylem || '9') || (a.son_tarih || '9').localeCompare(b.son_tarih || '9'); });
      if (!list.length) return;
      h += '<section class="group ' + (g[0] === 'gecik' ? 'late' : '') + '"><div class="group-head"><h2>' + g[1] + '</h2><span class="count">' + list.length + ' iş</span></div><div class="rows">';
      list.forEach(function (o) {
        var d = o.eylem ? P(o.eylem) : null;
        h += '<div class="row"><div class="when">' + (d ? '<div class="d">' + d.getDate() + '</div><div class="m">' + AYK[d.getMonth()] + '</div>' : '') + '</div>' + kart(o) + '</div>';
      });
      h += '</div></section>';
    });
    var und = vis.filter(function (o) { return o.grup === 'tarihsiz'; }).length;
    if (!h) h = '<p class="note" style="margin-top:26px">Bu türde tarihli iş yok' + (und ? '; tarihsiz bekleyenler sağ panelde.' : '.') + '</p>';
    document.getElementById('agenda').innerHTML = h;
  }

  // Tarihsiz
  document.getElementById('undated').innerHTML = items.filter(function (o) { return o.grup === 'tarihsiz'; }).map(function (o) {
    return '<div class="u" style="--c:' + turC(o.tur) + '"><span class="meta"><span class="tur"><span class="dot"></span>' + esc(turAd(o.tur)) + '</span></span><b>' + esc(o.baslik) + '</b><small>' + esc(o.yapilacak || '') + '</small></div>';
  }).join('') || '<div class="note">Yok.</div>';
  document.getElementById('done').innerHTML = (V.tamamlanan || []).slice().reverse().slice(0, 8).map(function (d) { return '<li>' + esc(d.baslik) + ' <span class="mono">' + kisa(d.tarih) + '</span></li>'; }).join('');

  // Ay takvimi
  var olay = {};
  function ekle(k, tip, o) { (olay[k] = olay[k] || []).push({ tip: tip, o: o }); }
  items.forEach(function (o) {
    if (o.son_tarih) ekle(o.son_tarih, 'son', o);
    (o.hatirlat || []).forEach(function (r) { ekle(r, 'hat', o); });
  });
  var ayBas = new Date(T.getFullYear(), T.getMonth(), 1), ofs = 0, secili = TK;
  function cizTakvim() {
    var m = new Date(ayBas.getFullYear(), ayBas.getMonth() + ofs, 1);
    document.getElementById('monthName').textContent = AY[m.getMonth()] + ' ' + m.getFullYear();
    document.getElementById('prevM').disabled = ofs <= -1;
    document.getElementById('nextM').disabled = ofs >= 5;
    var h = ['Pt','Sa','Ça','Pe','Cu','Ct','Pa'].map(function (w) { return '<div class="wd">' + w + '</div>'; }).join('');
    var bos = (m.getDay() + 6) % 7, gunSay = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
    for (var i = 0; i < bos; i++) h += '<div class="day other"></div>';
    for (var d = 1; d <= gunSay; d++) {
      var dt = new Date(m.getFullYear(), m.getMonth(), d), k = K(dt), ev = olay[k] || [];
      var marks = ev.slice(0, 3).map(function (e) { return e.tip === 'son' ? '<span style="--c:' + turC(e.o.tur) + '"></span>' : '<span class="r"></span>'; }).join('');
      var lbl = d + ' ' + AY[m.getMonth()] + (ev.length ? ', ' + ev.length + ' kayıt' : '');
      h += '<button class="day' + (k < TK ? ' past' : '') + (k === TK ? ' today' : '') + (k === secili ? ' sel' : '') + '" data-k="' + k + '" aria-label="' + lbl + '">' + d + '<span class="marks">' + marks + '</span></button>';
    }
    var c = document.getElementById('cal'); c.innerHTML = h;
    c.querySelectorAll('.day[data-k]').forEach(function (b) { b.onclick = function () { secili = b.getAttribute('data-k'); cizTakvim(); }; });
    cizGun();
  }
  function cizGun() {
    var ev = olay[secili] || [], d = P(secili);
    var h = '<div class="label">' + d.getDate() + ' ' + AY[d.getMonth()] + ' ' + GUN[d.getDay()] + '</div>';
    if (!ev.length) h += '<div class="empty">Bu gün için kayıt yok.</div>';
    ev.forEach(function (e) { h += '<div class="it"><span class="k">' + (e.tip === 'son' ? 'Son tarih' : 'Hatırlatma') + '</span><span><span class="dot" style="--c:' + turC(e.o.tur) + ';display:inline-block;margin-right:6px"></span>' + esc(e.o.baslik) + '</span></div>'; });
    document.getElementById('dayinfo').innerHTML = h;
  }
  document.getElementById('prevM').onclick = function () { ofs--; cizTakvim(); };
  document.getElementById('nextM').onclick = function () { ofs++; cizTakvim(); };

  document.getElementById('foot').innerHTML = 'Son güncelleme <span class="mono">' + kisa(V.guncelleme) + ' ' + P(V.guncelleme).getFullYear() + '</span> · Kaynak <span class="mono">00_SISTEM/takvim/gorevler.json</span> · Kalan gün sayıları sayfayı açtığın güne göre hesaplanır.';

  cizFiltre(); cizAjanda(); cizTakvim();
  if (V._kilitli) {
    var f = document.getElementById('foot');
    f.innerHTML += ' · <button class="linkbtn" id="unut">Bu cihazda kilitle</button>';
    document.getElementById('unut').onclick = function () { try { localStorage.removeItem('takvim-anahtar'); } catch (e) {} location.reload(); };
  }
}

// Açılış: düz veri varsa doğrudan çiz; yoksa şifreli veriyi çöz
(function () {
  var duz = document.getElementById('veri').textContent.trim();
  if (duz && duz.charAt(0) === '{') { ciz(JSON.parse(duz)); return; }
  var S = JSON.parse(document.getElementById('sifreli').textContent);
  var app = document.getElementById('app'), lock = document.getElementById('lock');
  app.hidden = true;
  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function coz(rawKey) {
    return crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt'])
      .then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(S.iv) }, k, b64(S.ct)); })
      .then(function (buf) { var V = JSON.parse(new TextDecoder().decode(buf)); V._kilitli = true; lock.hidden = true; app.hidden = false; ciz(V); });
  }
  function kilitGoster() { app.hidden = true; lock.hidden = false; document.getElementById('pw').focus(); }
  var kayitli = null; try { kayitli = localStorage.getItem('takvim-anahtar'); } catch (e) {}
  if (kayitli) coz(b64(kayitli)).catch(kilitGoster); else kilitGoster();
  lock.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var err = document.getElementById('lockErr'); err.textContent = 'Açılıyor…';
    crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('pw').value), 'PBKDF2', false, ['deriveBits'])
      .then(function (m) { return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(S.salt), iterations: S.iter, hash: 'SHA-256' }, m, 256); })
      .then(function (bits) {
        var raw = new Uint8Array(bits);
        return coz(raw).then(function () { try { localStorage.setItem('takvim-anahtar', btoa(String.fromCharCode.apply(null, raw))); } catch (e) {} });
      })
      .catch(function () { err.textContent = 'Şifre yanlış. Tekrar dene.'; });
  });
})();
</script>
